# PivotTrader - Centralized Setup Configurations
#
# Setup definitions with TC2000-compatible scan expressions (PCF).
# Two-Level Organization: Screener Folders -> Screeners
# Note: Folders and Screeners support optional 'visible: true|false' (defaults to true).
#       Set 'visible: false' to hide unused setups/folders from the UI without removing them.
# ==============================================================================

# Watchlist Playbook Setup Tags
tags:
  HTF:
    id: "HTF"
    label: "HTF"
    name: "High Tight Flag"
    icon: "⚡"
    color: "#f59e0b"
    description: "High tight flag & power play momentum runners for rapid trend continuation."
  VCP:
    id: "VCP"
    label: "VCP"
    name: "VCP Base"
    icon: "📐"
    color: "#10b981"
    description: "Stage 2 institutional bases, volatility contraction patterns, and cheat pivots."
  IPO:
    id: "IPO"
    label: "IPO"
    name: "IPO Base"
    icon: "🐣"
    color: "#06b6d4"
    description: "Newly public companies (< 1-2 years) building primary accumulation bases."
  EP:
    id: "EP"
    label: "EP"
    name: "Post EP"
    icon: "💥"
    color: "#ec4899"
    description: "Episodic pivots, high volume gap-ups, and post-earnings digestions."
  SHORT:
    id: "SHORT"
    label: "Short"
    name: "Short Setup"
    icon: "🐻"
    color: "#f43f5e"
    description: "Stage 4 markdown breakdowns, falling 30-week MA pullbacks, and climactic short setups."
  Others:
    id: "Others"
    label: "Others"
    name: "Others"
    icon: "📁"
    color: "#94a3b8"
    description: "Transitory stages or unclassified candidates."

folders:
  daily:
    id: "daily"
    name: "Daily"
    icon: "⚡"
    display_order: 1
    description: "Actionable trigger patterns and exact-day pivot buy points for daily monitoring and execution."
    default_screener_id: "episodic_pivot"
    screeners:
      - id: "five_ema_below_5pct"
        name: "5-EMA below <5%"
        icon: "🎯"
        tag: "HTF"
        target_folder: "weekly"
        description: "Jeff Sun process: 5-EMA pullback & consolidation filter run across all Weekly screeners, preserving individual setup tags."
        expression: "C >= EMA_5 AND C <= EMA_5 * 1.05 AND SMA_10 >= SMA_20 AND RET_1W < 5.0 AND ADR20 >= 3.5"
      - id: "low_cheat"
        name: "Low Cheat"
        icon: "🏹"
        tag: "VCP"
        description: "Early reversal entry in lower 1/3-1/2 of base with selling exhaustion or shakeout."
        expression: "LOW_CHEAT AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 3.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS <= 50.0"        
      - id: "episodic_pivot"
        name: "Episodic Pivot"
        icon: "💥"
        tag: "EP"
        description: "Massive gap-up (10%+) on heavy relative volume (>= 2.5x) driven by catalyst or earnings."
        expression: "DOLLAR_VOL >= 5_000_000 AND GAP_PCT >= 10.0 AND REL_VOL >= 2.5"
      - id: "ep_9_million"
        name: "EP9 Million"
        icon: "🔥"
        tag: "EP"
        description: "Stockbee EP9 Million: Volume >= 9M shares and >= 3x average volume on strong daily gain (>= 4%) with a green candle."
        expression: "C >= 3.0 AND V >= 8_900_000 AND REL_VOL >= 3.0 AND C >= C1 * 1.04 AND C >= O"                
      - id: "highest_volume_ever"
        name: "Highest Volume Ever"
        icon: "🌊"
        tag: "EP"
        description: "Breakout on high volume in the past year (52 weeks) on strong price expansion and close range."
        expression: "DOLLAR_VOL >= 5_000_000 AND HIGHEST_VOL_1Y AND C >= O * 1.025 AND CLOSE_RANGE >= 0.70"
      - id: "power_play"
        name: "Power Play"
        icon: "⚡"
        tag: "HTF"
        description: "100%+ Move within 8 weeks, <=25% Pullback, tight flag consolidation."
        expression: "DOLLAR_VOL >= 5_000_000 AND RUNUP >= 100.0 AND RUNUP_DAYS <= 40 AND PULLBACK <= 25.0 AND DAYS_SINCE_PEAK >= 10"
      - id: "qm_breakouts"
        name: "QM Breakouts"
        icon: "🎯"
        tag: "HTF"
        description: "30%+ prior move, tight 10/20 EMA surf, pivot clustering <= 3%."
        expression: "DOLLAR_VOL >= 5_000_000 AND ADR20 >= 4.0 AND RS_RANK >= 80 AND (COALESCE(RUNUP, 0) >= 30.0 OR COALESCE(RET_1M, 0) >= 15.0 OR COALESCE(RET_3M, 0) >= 30.0) AND PIVOT_SPREAD <= 8.0 AND PIVOT_CLUSTERING <= 3.0 AND PULLBACK <= 30.0 AND DAYS_SINCE_PEAK >= 10 AND DAYS_SINCE_PEAK <= 40 AND C > EMA_20 AND EMA_10 > EMA_20"
      # - id: "inside_day_compression"
      #   name: "Inside Day Compression"
      #   icon: "📦"
      #   tag: "VCP"
      #   description: "High ADR stock forming an Inside Day with volume contraction (V < V1) holding above rising 10/20 EMA."
      #   expression: "ADR20 >= 3.0 AND C >= 5.0 AND DOLLAR_VOL >= 8_000_000 AND INSIDE_DAY AND V < V1 AND C >= EMA_20 AND EMA_10 >= EMA_20"
      # - id: "cheat"
      #   name: "Cheat / 3-C"
      #   icon: "🔑"
      #   tag: "VCP"
      #   description: "Cup Completion Cheat (3-C) in mid-to-upper base before reaching prior peak."
      #   expression: "CONFIRMED_STAGED AND CHEAT AND C >= 5.0 AND ADR20 >= 3.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS >= 40.0 AND BASE_POS <= 80.0"

  weekly:
    id: "weekly"
    name: "Weekly"
    icon: "📅"
    display_order: 2
    description: "Universe preparation, multi-timeframe momentum leaders, quiet Stage 2 bases, and IPO pipeline."
    default_screener_id: "leaders"
    screeners:
      - id: "leaders"
        name: "Weekly Leaders"
        icon: "👑"
        tag: "HTF"
        description: "Leading momentum universe: Multi-timeframe gainers (1M/3M/6M), RS Rank >= 90, positive RS Line (>= 0), ADR >= 3.5%, and liquid dollar volume."
        expression: "CONFIRMED_STAGE2 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 3.5 AND RS_RANK >= 90 AND (RET_1M >= 25.0 OR RET_3M >= 30.0 OR RET_6M >= 50.0)"
      - id: "stage2_bases"
        name: "Stage 2 Bases"
        icon: "🌿"
        tag: "VCP"
        description: "Quiet Stage 2 & Trend Template consolidations (VCP, Cups, Cheats): within 25% of 52w high, positive RS Line (>= 0), and non-extended, excluding stocks already in Leaders or IPO Base."
        expression: "CONFIRMED_STAGE2 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 3.0 AND EXT_ATR_50 <= 3.5 AND NOT SCREENER_LEADERS AND NOT SCREENER_IPO_BASE"
      - id: "ipo_base"
        name: "IPO Base"
        icon: "🐣"
        tag: "IPO"
        description: "Early institutional accumulation in newly public companies (< 350 days) with low base depth."
        expression: "DOLLAR_VOL >= 5_000_000 AND IPO_DAYS >= 22 AND IPO_DAYS <= 350 AND IPO_DRAWDOWN <= 25.0 AND IPO_DEPTH <= 35.0"      
      
  short:
    id: "short"
    name: "Short"
    icon: "🐻"
    display_order: 4
    description: "Stan Weinstein Stage 4 markdown breakdowns, 30-week MA pullbacks, and climactic short setups."
    default_screener_id: "weinstein_breakdown"
    screeners:
      - id: "weinstein_breakdown"
        name: "Stage 4 Breakdown"
        icon: "📉"
        tag: "SHORT"
        description: "Primary Stage 3-to-4 breakdown below falling 30-week (150-day) MA, low RS rank (<=40), and weak close."
        expression: "STAGE4 AND C < SMA_150 AND C < SMA_50 AND SMA_50 < SMA_150 AND RS_RANK <= 40 AND CLOSE_RANGE <= 0.35 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "weinstein_pullback"
        name: "Pullback to 30W MA"
        icon: "🧲"
        tag: "SHORT"
        description: "Second-chance short: reflexive bounce testing underside of falling 30-week MA (within 6%) and rolling over."
        expression: "STAGE4 AND C < SMA_150 AND (SMA_150 - C) / SMA_150 <= 0.06 AND C < C1 AND RS_RANK <= 35 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage4_continuation"
        name: "Stage 4 Continuation"
        icon: "⛏️"
        tag: "SHORT"
        description: "Entrenched Stage 4 markdown: breaking consolidation shelves near 52-week low with weak RS (<=30)."
        expression: "STAGE4 AND RS_RANK <= 30 AND C < SMA_50 AND SMA_50 < SMA_150 AND DIST_52W_LOW <= 5.0 AND CLOSE_RANGE <= 0.35 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "parabolic_short"
        name: "Parabolic Short"
        icon: "🌋"
        tag: "SHORT"
        description: "Overextended momentum climaxes (>= 18% above 10 EMA) for mean-reversion short setups."
        expression: "C >= 1.0 AND PARABOLIC_SHORT AND DIST_EMA10 >= 18.0 AND UP_DAYS >= 3"
      - id: "parabolic_climax_short"
        name: "Parabolic Climax Short"
        icon: "🌋"
        tag: "SHORT"
        description: "Parabolic exhaustion climax short: extended >= 6x ATR from 50 SMA and >= 15% above 10 EMA with 3+ consecutive up days."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND EXT_ATR_50 >= 6.0 AND (C - EMA_10) / EMA_10 >= 0.15 AND UP_DAYS >= 3"        
      - id: "gap_breakdown"
        name: "Downside Gap Breakdown"
        icon: "💥"
        tag: "SHORT"
        description: "Distribution gap-down (-7%+ on 2x+ volume) below 50-day moving average on negative catalyst."
        expression: "GAP_PCT <= -7.0 AND REL_VOL >= 2.0 AND C < SMA_50 AND CLOSE_RANGE <= 0.35 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"

  others:
    id: "others"
    name: "Others"
    icon: "📁"
    display_order: 6
    description: "Baseline market filters, stage screening, and universe definitions."
    default_screener_id: "confirmed_staged"
    screeners:
      - id: "confirmed_staged"
        name: "Confirmed Staged"
        icon: "📈"
        tag: "VCP"
        description: "Mark Minervini Stage 2 Trend Template with verified 50 > 150 > 200 SMA stack & rising 200-day MA."
        expression: "CONFIRMED_STAGED AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage1"
        name: "Stage 1 Basing"
        icon: "🟦"
        tag: "Others"
        description: "Stan Weinstein Stage 1: Base building & accumulation after prior markdown (flat 30W MA)."
        expression: "STAGE1 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage2"
        name: "Stage 2 Advancing"
        icon: "🟩"
        tag: "VCP"
        description: "Stan Weinstein Stage 2: Markup uptrend with rising 30-week (150-day) moving average."
        expression: "STAGE2 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage3"
        name: "Stage 3 Topping"
        icon: "🟨"
        tag: "Others"
        description: "Stan Weinstein Stage 3: Top distribution & churning near highs (flattening 30W MA)."
        expression: "STAGE3 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage4"
        name: "Stage 4 Declining"
        icon: "🟥"
        tag: "SHORT"
        description: "Stan Weinstein Stage 4: Markdown downtrend below falling 30-week (150-day) moving average."
        expression: "STAGE4 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "all"
        name: "All Gainers + Stage 2"
        icon: "🌌"
        tag: "VCP"
        description: "Comprehensive universe of liquid Stage 2 stocks and multi-timeframe gainers."        
        expression: "C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND (CONFIRMED_STAGED OR RET_1M >= 20.0 OR RET_3M >= 30.0 OR RET_6M >= 50.0)"

  martin_luk:
    id: "martin_luk"
    name: "Martin Luk"
    icon: "📦"
    display_order: 5
    description: "Martin Luk's setups: Trend structure categorization (Lead/Mediocre/Lag) and actionable 10/20 EMA swing triggers."
    default_screener_id: "lead"
    screeners:
      - id: "lead"
        name: "Lead"
        icon: "🚀"
        tag: "HTF"
        description: "Leading trend alignment: 10 EMA > 20 EMA > 50 EMA with Dollar Volume > $50M and ADR >= 3.5%."
        expression: "EMA_10 > EMA_20 AND EMA_20 > EMA_50 AND DOLLAR_VOL > 50_000_000 AND ADR >= 3.5"
      - id: "mediocre"
        name: "Mediocre"
        icon: "⚖️"
        tag: "Others"
        description: "Mixed moving average alignment: (10 EMA > 20 EMA < 50 EMA or 10 EMA < 20 EMA > 50 EMA) with Dollar Volume > $50M and ADR >= 3.5%."
        expression: "((EMA_10 > EMA_20 AND EMA_20 < EMA_50) OR (EMA_10 < EMA_20 AND EMA_20 > EMA_50)) AND DOLLAR_VOL > 50_000_000 AND ADR >= 3.5"
      - id: "lag"
        name: "Lag"
        icon: "🔻"
        tag: "SHORT"
        description: "Lagging trend alignment: 10 EMA < 20 EMA < 50 EMA with Dollar Volume > $50M and ADR >= 3.5%."
        expression: "EMA_10 < EMA_20 AND EMA_20 < EMA_50 AND DOLLAR_VOL > 50_000_000 AND ADR >= 3.5"
      - id: "pullback_10ema"
        name: "10-EMA Pullback"
        icon: "🎯"
        tag: "HTF"
        description: "Martin Luk primary entry: Pullback to rising 10 EMA (within -2% to +3%) in Lead alignment ($10 > 20 > 50$), non-extended."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10_000_000 AND ADR >= 3.5 AND EMA_10 > EMA_20 AND EMA_20 > EMA_50 AND C >= EMA_10 * 0.98 AND C <= EMA_10 * 1.03 AND EXT_ATR_50 <= 4.0"
      - id: "reset_20ema"
        name: "20-EMA Reset"
        icon: "🧲"
        tag: "VCP"
        description: "Martin Luk secondary re-entry: Deeper consolidation testing rising 20 EMA (within -2% to +4%) in Lead alignment, holding above 50 EMA."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10_000_000 AND ADR >= 3.5 AND EMA_10 > EMA_20 AND EMA_20 > EMA_50 AND C >= EMA_20 * 0.98 AND C <= EMA_20 * 1.04 AND C > EMA_50"
      - id: "high_tight_breakout"
        name: "High Tight Breakout"
        icon: "⚡"
        tag: "HTF"
        description: "Martin Luk momentum breakout: Leading stocks in 10 > 20 > 50 EMA stack consolidating within 10% of 52-week high surfing above 10 EMA."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10_000_000 AND ADR >= 3.5 AND EMA_10 > EMA_20 AND EMA_20 > EMA_50 AND DIST_52W_HIGH <= 10.0 AND C >= EMA_10"

  archive:
    id: "archive"
    name: "Archive"
    icon: "📦"
    display_order: 7
    description: "Backup reference library of granular multi-timeframe gainers and trend duration screeners."
    default_screener_id: "gainers"
    screeners:
      - id: "gainers"
        name: "Top Gainers"
        icon: "🏆"
        tag: "HTF"
        description: "Top gainers across 1M, 3M, or 6M momentum timeframes."
        expression: "STAGE2 AND ADR20 >= 3.0 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND ((RET_1M >= 30.0 AND TOP(RET_1M, 50)) OR (RET_3M >= 30.0 AND TOP(RET_3M, 80)) OR (RET_6M >= 50.0 AND TOP(RET_6M, 100)))"
      - id: "1m"
        name: "1M Gainers"
        icon: "🔥"
        tag: "HTF"
        description: "Top 50 fastest moving momentum runners over 1 month."
        expression: "ADR20 >= 3.0 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND RET_1M >= 30.0 ORDER BY RET_1M DESC LIMIT 50"
      - id: "3m"
        name: "3M Gainers"
        icon: "🚀"
        tag: "HTF"
        description: "Top 50 intermediate momentum gainers over 3 months."
        expression: "ADR20 >= 3.0 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND RET_3M >= 30.0 AND RET_1M < 30.0 ORDER BY RET_3M DESC LIMIT 50"
      - id: "6m"
        name: "6M Gainers"
        icon: "🌊"
        tag: "HTF"
        description: "Top 50 sustained institutional leaders over 6 months."
        expression: "ADR20 >= 3.0 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND RET_6M >= 50.0 AND RET_3M < 30.0 AND RET_1M < 30.0 ORDER BY RET_6M DESC LIMIT 50"
      - id: "high_adr_hottest"
        name: "High ADR% Hottest"
        icon: "🔥"
        tag: "HTF"
        description: "High velocity momentum leaders with ADR >= 5% in Stage 2, RS >= 80, adhering to the <= 4x ATR extension rule."
        expression: "STAGE2 AND ADR20 >= 5.0 AND RS_RANK >= 80 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND EXT_ATR_50 <= 4.0"
      - id: "trend_1m"
        name: "1M Trend"
        icon: "🌱"
        tag: "VCP"
        description: "Early Stage 2 turnaround with 50 > 150 > 200 SMA stack for ~1 month."
        expression: "CONFIRMED_STAGED AND STAGE2_DAYS <= 30 AND RS_RANK >= 70 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 3.0"
      - id: "trend_3m"
        name: "3M Trend"
        icon: "🌿"
        tag: "VCP"
        description: "Established Stage 2 institutional trend with 50 > 150 > 200 SMA stack for > 3 months."
        expression: "CONFIRMED_STAGED AND STAGE2_DAYS > 60 AND RS_RANK >= 70 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 3.0"
      - id: "extended_base"
        name: "Extended Base"
        icon: "☕"
        tag: "VCP"
        description: "Prolonged multi-month base (30-140 days) with tight pivot spread <= 5% and <= 3.5x ATR extension from 50 SMA."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 2.0 AND DIST_52W_HIGH <= 15.0 AND PIVOT_SPREAD <= 5.0 AND PULLBACK <= 30.0 AND DAYS_SINCE_PEAK >= 25 AND DAYS_SINCE_PEAK <= 140 AND EXT_ATR_50 <= 3.5"
