  others:
    id: "study"
    name: "Study"
    icon: "📁"
    display_order: 6
    description: "Baseline market filters, stage screening, and universe definitions."
    default_screener_id: "zanger_breakout_study"
    screeners:
      - id: "zanger_breakout_study"
        name: "ZVR Breakout"
        icon: "💥"
        tag: "BO"
        description: "High growth stocks breaking out on Projected RVOL >= 1.5x (20d MA baseline), top 30% candle close, non-extended."
        expression: "SCREENER_GROWTH_GAINERS AND PROJ_RVOL >= 1.5 AND C > C1 AND C >= O AND EXT_ATR_50 <= 4.5 ORDER BY PROJ_RVOL DESC" 
      - id: "high_rvol"
        name: "High RVOL"
        icon: "📡"
        tag: "BO"
        description: "High volume on stocks."
        expression: "SCREENER_GAINERS AND PROJ_RVOL >= 1.5 AND C > 20 AND C > C1 ORDER BY PROJ_RVOL DESC"            
      - id: "confirmed_staged"
        name: "Confirmed Staged"
        icon: "📈"
        tag: "VCP"
        description: "Mark Minervini Stage 2 Trend Template with verified 50 > 150 > 200 SMA stack & rising 200-day MA."
        expression: "CONFIRMED_STAGED AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage1"
        name: "Stage 1 Basing"
        icon: "🟦"
        tag: "Others"
        description: "Stan Weinstein Stage 1: Base building & accumulation after prior markdown (flat 30W MA)."
        expression: "STAGE1 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage2"
        name: "Stage 2 Advancing"
        icon: "🟩"
        tag: "VCP"
        description: "Stan Weinstein Stage 2: Markup uptrend with rising 30-week (150-day) moving average."
        expression: "STAGE2 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage3"
        name: "Stage 3 Topping"
        icon: "🟨"
        tag: "Others"
        description: "Stan Weinstein Stage 3: Top distribution & churning near highs (flattening 30W MA)."
        expression: "STAGE3 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "stage4"
        name: "Stage 4 Declining"
        icon: "🟥"
        tag: "SHORT"
        description: "Stan Weinstein Stage 4: Markdown downtrend below falling 30-week (150-day) moving average."
        expression: "STAGE4 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000"
      - id: "all"
        name: "All Gainers + Stage 2"
        icon: "🌌"
        tag: "VCP"
        description: "Comprehensive universe of liquid Stage 2 stocks and multi-timeframe gainers."        
        expression: "C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND (CONFIRMED_STAGED OR RET_1M >= 20.0 OR RET_3M >= 30.0 OR RET_6M >= 50.0)"

  martin_luk:
    id: "martin_luk"
    name: "Martin Luk"
    icon: "📦"
    display_order: 5
    description: "Martin Luk's setups: Trend structure categorization (Lead/Mediocre/Lag) and actionable 10/20 EMA swing triggers."
    default_screener_id: "lead"
    screeners:
      - id: "lead"
        name: "Lead"
        icon: "🚀"
        tag: "BO"
        description: "Leading trend alignment: 10 EMA > 20 EMA > 50 EMA with Dollar Volume > $50M and ADR >= 3.5%."
        expression: "EMA_10 > EMA_20 AND EMA_20 > EMA_50 AND DOLLAR_VOL > 50_000_000 AND ADR >= 3.5"
      - id: "mediocre"
        name: "Mediocre"
        icon: "⚖️"
        tag: "Others"
        description: "Mixed moving average alignment: (10 EMA > 20 EMA < 50 EMA or 10 EMA < 20 EMA > 50 EMA) with Dollar Volume > $50M and ADR >= 3.5%."
        expression: "((EMA_10 > EMA_20 AND EMA_20 < EMA_50) OR (EMA_10 < EMA_20 AND EMA_20 > EMA_50)) AND DOLLAR_VOL > 50_000_000 AND ADR >= 3.5"
      - id: "lag"
        name: "Lag"
        icon: "🔻"
        tag: "SHORT"
        description: "Lagging trend alignment: 10 EMA < 20 EMA < 50 EMA with Dollar Volume > $50M and ADR >= 3.5%."
        expression: "EMA_10 < EMA_20 AND EMA_20 < EMA_50 AND DOLLAR_VOL > 50_000_000 AND ADR >= 3.5"
      - id: "pullback_10ema"
        name: "10-EMA Pullback"
        icon: "🎯"
        tag: "BO"
        description: "Martin Luk primary entry: Pullback to rising 10 EMA (within -2% to +3%) in Lead alignment ($10 > 20 > 50$), non-extended."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10_000_000 AND ADR >= 3.5 AND EMA_10 > EMA_20 AND EMA_20 > EMA_50 AND C >= EMA_10 * 0.98 AND C <= EMA_10 * 1.03 AND EXT_ATR_50 <= 4.0"
      - id: "reset_20ema"
        name: "20-EMA Reset"
        icon: "🧲"
        tag: "VCP"
        description: "Martin Luk secondary re-entry: Deeper consolidation testing rising 20 EMA (within -2% to +4%) in Lead alignment, holding above 50 EMA."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10_000_000 AND ADR >= 3.5 AND EMA_10 > EMA_20 AND EMA_20 > EMA_50 AND C >= EMA_20 * 0.98 AND C <= EMA_20 * 1.04 AND C > EMA_50"
      - id: "high_tight_breakout"
        name: "High Tight Breakout"
        icon: "⚡"
        tag: "BO"
        description: "Martin Luk momentum breakout: Leading stocks in 10 > 20 > 50 EMA stack consolidating within 10% of 52-week high surfing above 10 EMA."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10_000_000 AND ADR >= 3.5 AND EMA_10 > EMA_20 AND EMA_20 > EMA_50 AND DIST_52W_HIGH <= 10.0 AND C >= EMA_10"

  archive:
    id: "archive"
    name: "Archive"
    icon: "📦"
    display_order: 7
    description: "Backup reference library of granular multi-timeframe gainers and trend duration screeners."
    default_screener_id: "high_adr_hottest"
    screeners:
      - id: "high_adr_hottest"
        name: "High ADR% Hottest"
        icon: "🔥"
        tag: "BO"
        description: "High velocity momentum leaders with ADR >= 5% in Stage 2, RS >= 80, adhering to the <= 4x ATR extension rule."
        expression: "STAGE2 AND ADR20 >= 5.0 AND RS_RANK >= 80 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND EXT_ATR_50 <= 4.0"
      - id: "extended_base"
        name: "Extended Base"
        icon: "☕"
        tag: "VCP"
        description: "Prolonged multi-month base (30-140 days) with tight pivot spread <= 5% and <= 3.5x ATR extension from 50 SMA."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 2.0 AND DIST_52W_HIGH <= 15.0 AND PIVOT_SPREAD <= 5.0 AND PULLBACK <= 30.0 AND DAYS_SINCE_PEAK >= 25 AND DAYS_SINCE_PEAK <= 140 AND EXT_ATR_50 <= 3.5"
