# PivotTrader - Centralized Setup Configurations
#
# Setup definitions with TC2000-compatible scan expressions (PCF).
# Two-Level Organization: Screener Folders -> Screeners
# Note: Folders and Screeners support optional 'visible: true|false' (defaults to true).
#       Set 'visible: false' to hide unused setups/folders from the UI without removing them.
# ==============================================================================

# Watchlist Playbook Setup Tags
tags:
  BO:
    id: "BO"
    label: "BO"
    name: "Breakout"
    icon: "⚡"
    color: "#f59e0b"
    description: "Breakouts, high tight flags & power play momentum runners for rapid trend continuation."
  VCP:
    id: "VCP"
    label: "VCP"
    name: "VCP Base"
    icon: "📐"
    color: "#10b981"
    description: "Stage 2 institutional bases, volatility contraction patterns, and cheat pivots."
  IPO:
    id: "IPO"
    label: "IPO"
    name: "IPO Base"
    icon: "🐣"
    color: "#06b6d4"
    description: "Newly public companies (< 1-2 years) building primary accumulation bases."
  EP:
    id: "EP"
    label: "EP"
    name: "Post EP"
    icon: "💥"
    color: "#ec4899"
    description: "Episodic pivots, high volume gap-ups, and post-earnings digestions."
  SHORT:
    id: "SHORT"
    label: "Short"
    name: "Short Setup"
    icon: "🐻"
    color: "#f43f5e"
    description: "Stage 4 markdown breakdowns, falling 30-week MA pullbacks, and climactic short setups."
  Others:
    id: "Others"
    label: "Others"
    name: "Others"
    icon: "📁"
    color: "#94a3b8"
    description: "Transitory stages or unclassified candidates."

folders:
  action:
    id: "action"
    name: "Action"
    icon: "🎯"
    display_order: 1
    default: true
    description: "Close watch for execution."
    default_screener_id: "zanger_breakout"
    screeners:
      - id: "zanger_breakout"
        name: "Volume Breakout"
        icon: "💥"
        tag: "BO"
        description: "Breaking out on Projected RVOL >= 2.0x (20d MA baseline), top 30% candle close, non-extended."
        expression: "IN_WATCHLIST AND PROJ_RVOL >= 1.5 AND C > C1 AND C >= O AND EXT_ATR_50 <= 4.5 ORDER BY PROJ_RVOL DESC"
      - id: "episodic_pivot"
        name: "Episodic Pivot"
        icon: "💥"
        tag: "EP"
        description: "Massive gap-up (10%+) on heavy relative volume (>= 2.5x) driven by catalyst or earnings."
        expression: "DOLLAR_VOL >= 5_000_000 AND GAP_PCT >= 10.0 AND RVOL >= 2.5"
      - id: "ep_9_million"
        name: "EP9 Million"
        icon: "🔥"
        tag: "EP"
        description: "Stockbee EP9 Million: Volume >= 9M shares and >= 3x average volume on strong daily gain (>= 4%) with a green candle."
        expression: "C >= 3.0 AND V >= 8_900_000 AND RVOL >= 3.0 AND C >= C1 * 1.04 AND C >= O"
  daily:
    id: "daily"
    name: "Daily"
    icon: "⚡"
    display_order: 2
    description: "Actionable trigger patterns and exact-day pivot buy points for daily monitoring and execution."
    default_screener_id: "buyable"
    screeners:
      - id: "buyable"
        name: "Surf EMA"
        icon: "🎯"
        tag: "BO"
        description: "Actionable tight-range breakout candidates."
        expression: "SCREENER_GAINERS AND ((C >= EMA_10 AND C <= EMA_10 * 1.05) OR (C >= EMA_20 AND C <= EMA_20 * 1.05)) AND SMA_10 >= SMA_20 AND RET_1W < 5.0 AND PIVOT_SPREAD <= 8.0 AND PIVOT_CLUSTERING <= 3.0 AND EXT_ATR_50 <= 4.0"
      - id: "vdu_coils"
        name: "VDU Coils"
        icon: "🤫"
        tag: "VCP"
        description: "Volume Dry-Up (VDU) coiled at pivot: Volume <= 40% of 50d average, tight 3-day spread <= 6%, holding above rising 20 EMA."
        expression: "SCREENER_GAINERS AND V <= AVGV50 * 0.40 AND PIVOT_SPREAD <= 6.0 AND C >= EMA_20 AND EXT_ATR_50 <= 4.0"        
      - id: "zanger_zvr_breakout"
        name: "Volume Breakout"
        icon: "💥"
        tag: "BO"
        description: "Breaking out on Projected RVOL >= 2.0x (20d MA baseline), top 30% candle close, within 15% of 52-week high."
        expression: "SCREENER_GAINERS AND PROJ_RVOL >= 2.0 AND C > C1 AND C >= O AND CLOSE_RANGE >= 0.70 AND DIST_52W_HIGH <= 15.0 AND EXT_ATR_50 <= 4.5 ORDER BY PROJ_RVOL DESC"        
      - id: "parabolic_short"
        name: "Parabolic Short"
        icon: "🌋"
        tag: "SHORT"
        description: "Kristjan Qullamaggie Parabolic Short: 3-5+ up days, >= 20% above 10 EMA, ADR >= 5% on +50-100%+ move (large cap) or +150-300%+ (small cap)."
        expression: "C >= 1.0 AND ADR20 >= 5.0 AND DIST_EMA10 >= 20.0 AND C > C1 AND C1 > C2 AND C2 > C3 AND ((MARKET_CAP >= 2_000_000_000 AND (RET_1M >= 50.0 OR RET_1W >= 40.0)) OR (COALESCE(MARKET_CAP, 0) < 2_000_000_000 AND (RET_1M >= 150.0 OR RET_3M >= 250.0 OR DIST_EMA10 >= 40.0)))"
      - id: "parabolic_long"
        name: "Parabolic Long"
        icon: "🪂"
        tag: "BO"
        description: "Kristjan Qullamaggie Parabolic Long: 3-5+ red days, <= -20% below 10 EMA, ADR >= 5% on -30-50%+ drop (large cap) or -50-70%+ (small cap)."
        expression: "SCREENER_LIQUID AND AND DIST_EMA10 <= -20.0 AND C < C1 AND C1 < C2 AND C2 < C3 AND ((MARKET_CAP >= 2_000_000_000 AND (RET_1M <= -30.0 OR RET_1W <= -20.0)) OR (COALESCE(MARKET_CAP, 0) < 2_000_000_000 AND (RET_1M <= -50.0 OR RET_3M <= -60.0 OR DIST_EMA10 <= -35.0)))"
      # - id: "highest_volume_ever"
      #   name: "Highest Volume Ever"
      #   icon: "🌊"
      #   tag: "EP"
      #   description: "Breakout on high volume in the past year (52 weeks) on strong price expansion and close range."
      #   expression: "DOLLAR_VOL >= 5_000_000 AND HIGHEST_VOL_1Y AND C >= O * 1.025 AND CLOSE_RANGE >= 0.70"
      - id: "power_play"
        name: "Power Play"
        icon: "⚡"
        tag: "BO"
        description: "100%+ Move within 8 weeks, <=25% Pullback, tight flag consolidation."
        expression: "SCREENER_LIQUID AND RUNUP >= 100.0 AND RUNUP_DAYS <= 40 AND PULLBACK <= 25.0 AND DAYS_SINCE_PEAK >= 10"
      # - id: "low_cheat"
      #   name: "Low Cheat"
      #   icon: "🏹"
      #   tag: "BO"
      #   description: "Early reversal entry in lower 1/3-1/2 of base with selling exhaustion or shakeout."
      #   expression: "LOW_CHEAT AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 3.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS <= 50.0"
      # - id: "qm_breakouts"
      #   name: "QM Breakouts"
      #   icon: "🎯"
      #   tag: "BO"
      #   description: "30%+ prior move, tight 10/20 EMA surf, pivot clustering <= 3%."
      #   expression: "DOLLAR_VOL >= 5_000_000 AND ADR20 >= 4.0 AND RS_RANK >= 80 AND (COALESCE(RUNUP, 0) >= 30.0 OR COALESCE(RET_1M, 0) >= 15.0 OR COALESCE(RET_3M, 0) >= 30.0) AND PIVOT_SPREAD <= 8.0 AND PIVOT_CLUSTERING <= 3.0 AND PULLBACK <= 30.0 AND DAYS_SINCE_PEAK >= 10 AND DAYS_SINCE_PEAK <= 40 AND C > EMA_20 AND EMA_10 > EMA_20"
      # - id: "inside_day_compression"
      #   name: "Inside Day Compression"
      #   icon: "📦"
      #   tag: "VCP"
      #   description: "High ADR stock forming an Inside Day with volume contraction (V < V1) holding above rising 10/20 EMA."
      #   expression: "ADR20 >= 3.0 AND C >= 5.0 AND DOLLAR_VOL >= 8_000_000 AND INSIDE_DAY AND V < V1 AND C >= EMA_20 AND EMA_10 >= EMA_20"
      # - id: "cheat"
      #   name: "Cheat / 3-C"
      #   icon: "🔑"
      #   tag: "VCP"
      #   description: "Cup Completion Cheat (3-C) in mid-to-upper base before reaching prior peak."
      #   expression: "CONFIRMED_STAGED AND CHEAT AND C >= 5.0 AND ADR20 >= 3.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS >= 40.0 AND BASE_POS <= 80.0"

  weekly:
    id: "weekly"
    name: "Weekly"
    icon: "📅"
    display_order: 3
    description: "Universe preparation, multi-timeframe momentum leaders, quiet Stage 2 bases, and IPO pipeline."
    default_screener_id: "gainers"
    screeners:
      - id: "growth_gainers"
        name: "High Growth Gainers"
        icon: "🔥"
        tag: "BO"
        description: "Leaders with great foundamental."
        expression: "SCREENER_GAINERS AND EPS_DILUTED > 0.10 AND EPS_GROWTH >= 40.0 AND SALES_GROWTH >= 40.0"
      - id: "gainers"
        name: "Top Gainers"
        icon: "🏆"
        tag: "BO"
        description: "Combined momentum leaders across 1M (>=30%), 3M (>=50%), or 6M (>=80%) timeframes."
        expression: "RS_RANK >= 70 AND (SCREENER_1M OR SCREENER_3M OR SCREENER_6M)"
      - id: "1m"
        name: "1M Gainers"
        icon: "🔥"
        tag: "BO"
        description: "Fastest moving momentum runners over 1 month (RET_1M >= 30%, ADR >= 3.5%)."
        expression: "SCREENER_LIQUID AND RET_1M >= 30.0 ORDER BY RET_1M DESC"
      - id: "3m"
        name: "3M Gainers"
        icon: "🚀"
        tag: "BO"
        description: "Intermediate momentum gainers over 3 months (RET_3M >= 50%, ADR >= 3.5%), excluding 1M Gainers."
        expression: "SCREENER_LIQUID AND RET_3M >= 50.0 AND NOT SCREENER_1M ORDER BY RET_3M DESC"
      - id: "6m"
        name: "6M Gainers"
        icon: "🌊"
        tag: "BO"
        description: "Sustained institutional leaders over 6 months (RET_6M >= 80%, ADR >= 3.5%), excluding 1M and 3M Gainers."
        expression: "SCREENER_LIQUID AND RET_6M >= 80.0 AND NOT SCREENER_1M AND NOT SCREENER_3M ORDER BY RET_6M DESC"
      - id: "trend_1m"
        name: "1M Trend"
        icon: "🌱"
        tag: "VCP"
        description: "Early Stage 2 turnaround with 50 > 150 > 200 SMA stack for ~1 month."
        expression: "CONFIRMED_STAGED AND STAGE2_DAYS <= 30 AND RS_RANK >= 70 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 3.0"
      - id: "trend_3m"
        name: "3M Trend"
        icon: "🌿"
        tag: "VCP"
        description: "Established Stage 2 institutional trend with 50 > 150 > 200 SMA stack for > 3 months."
        expression: "CONFIRMED_STAGED AND STAGE2_DAYS > 60 AND RS_RANK >= 70 AND C >= 5.0 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 3.0"
      - id: "ipo_base"
        name: "IPO Base"
        icon: "🐣"
        tag: "IPO"
        description: "Early institutional accumulation in newly public companies (< 350 days) with low base depth."
        expression: "SCREENER_LIQUID AND IPO_DAYS >= 22 AND IPO_DAYS <= 350 AND IPO_DRAWDOWN <= 25.0 AND IPO_DEPTH <= 35.0"        

  base:
    id: "base"
    name: "Base"
    icon: "🚀"
    display_order: 3
    description: "Common screener conditions."
    default_screener_id: "zanger_hyper_growth"
    screeners:
      - id: "liquid"
        name: "Liquid"
        icon: "🔥"
        tag: "Other"
        description: "Liquid stocks"
        expression: "C >= 5.0 AND AVGV50 >= 100_000 AND DOLLAR_VOL >= 5_000_000 AND ADR20 >= 4.0"
      - id: "monster_growth"
        name: "Monster Growth 40/40+"
        icon: "🔥"
        tag: "Other"
        description: "Dan Zanger Rule #1 Universe: Liquid stocks with positive Diluted EPS, Quarterly EPS YoY >= 40%, and Sales YoY >= 40%."
        expression: "EPS_DILUTED > 0.10 AND EPS_GROWTH >= 40.0 AND SALES_GROWTH >= 40.0 ORDER BY EPS_GROWTH DESC"
      - id: "hyper_growth"
        name: "Hyper Growth 100/50+"
        icon: "⚡"
        tag: "Other"
        description: "Extreme Zanger fundamental fuel: EPS YoY >= 100%, Sales YoY >= 50%, with positive sequential QoQ EPS and Sales expansion."
        expression: "EPS_DILUTED > 0.10 AND EPS_GROWTH >= 100.0 AND SALES_GROWTH >= 50.0 AND COALESCE(EPS_QOQ, 1) > 0 AND COALESCE(SALES_QOQ, 1) > 0 ORDER BY EPS_GROWTH DESC"

