# PivotTrader - Centralized Setup Configurations
#
# Filter definitions are managed in `filters.yaml`.
# Baseline filters and visible controls are defined in `base_setup` and inherited
# by all setups. Individual setups can override any filter or add specific rules.
# ==============================================================================

# ==============================================================================
# Global Base Setup (Universal Defaults)
# ==============================================================================
base_setup:
  id: "base_setup"
  name: "Global Base Setup"
  filters:
    min_price: 5.0
    min_volume_sma_50: 100000
    min_dollar_vol: 10000000.0
    enforce_stage2: false
    enable_rs: false
  visible_filters:
    - min_price
    - min_dollar_vol
    - min_volume_sma_50

# ==============================================================================
# Setup Configurations
# ==============================================================================
setups:
  breakout:
    id: "breakouts"
    name: "Breakouts & HTF"
    icon: "🎯"
    display_order: 1
    description: "Consolidations and High Tight Flags (Power Plays) ready to break out along rising moving averages."
    sub_title: "Breakout Mode:"
    sub_setups:
      - id: "htf"
        name: "Power Play / HTF"
        label: "⚡ Power Play / HTF (100%+ Move, ≤25% Pullback)"
        filters:
          breakout_subview: "htf"
          min_breakout_runup: 100.0
          runup_window_weeks: 8.0
          max_breakout_drawdown: 25.0
          min_breakout_days: 10
          max_breakout_days: 30
          enable_htf_mode: true
          require_pivot_tightness: false
          enable_adr: false
      - id: "standard"
        name: "QM Breakouts"
        label: "🎯 QM Breakouts (30%+ Move)"
        filters:
          breakout_subview: "standard"
          min_breakout_runup: 30.0
          runup_window_weeks: 12.0
          max_breakout_drawdown: 30.0
          min_breakout_days: 10
          max_breakout_days: 40
          enable_htf_mode: false
          require_pivot_tightness: true
          max_pivot_spread: 8.0
          max_pivot_clustering: 3.0
          max_pivot_vol_ratio: 0.80
          enable_adr: true
          min_adr_20d: 4.0
    filters:
      require_breakout: true
      min_dollar_vol: 3000000.0  # Overrides base_setup (10M -> 3M)
      breakout_subview: "htf"
      enable_htf_mode: true
      min_breakout_runup: 100.0
      runup_window_weeks: 8.0
      max_breakout_drawdown: 25.0
      min_breakout_days: 10
      max_breakout_days: 30
      enable_ema_surfing: false
      require_pivot_tightness: false
      enable_adr: false      
    visible_filters:
      - min_breakout_runup
      - runup_window_weeks
      - max_breakout_drawdown
      - min_breakout_days
      - max_breakout_days
      - enable_ema_surfing
      - enable_adr
      - min_adr_20d
      - require_pivot_tightness
      - max_pivot_spread
      - max_pivot_clustering
      - max_pivot_vol_ratio

  episodic_pivot:
    id: "episodic_pivot"
    name: "Episodic Pivot"
    icon: "⚡"
    display_order: 2
    description: "Massive gap-up (10%+) on heavy relative volume driven by catalyst or earnings."
    filters:
      require_episodic_pivot: true
      min_dollar_vol: 5000000.0  # Overrides base_setup (10M -> 5M)
      min_ep_gap: 10.0
      min_ep_rel_vol: 2.5
    visible_filters:
      - min_ep_gap
      - min_ep_rel_vol

  parabolic:
    id: "parabolic"
    name: "Parabolic Short"
    icon: "🌋"
    display_order: 3
    description: "Overextended momentum climaxes for mean-reversion short setups."
    filters:
      require_parabolic: true
      min_price: 1.0
      min_volume_sma_50: 0
      min_dollar_vol: 0.0
      enable_parabolic_short: true
      min_parabolic_runup: 40.0
      min_parabolic_ema_dist: 18.0
      min_parabolic_up_days: 3
    visible_filters:
      - min_parabolic_runup
      - min_parabolic_ema_dist
      - min_parabolic_up_days

  ipo_base:
    id: "ipo_base"
    name: "IPO Base"
    icon: "🌱"
    display_order: 4
    description: "Early institutional accumulation in newly public companies (< 350 days)."
    filters:
      require_ipo_base: true
      min_dollar_vol: 5000000.0  # Overrides base_setup (10M -> 5M)
      max_ipo_age: 350
      max_ipo_dist: 25.0
      max_ipo_depth: 35.0
    visible_filters:
      - max_ipo_age
      - max_ipo_dist
      - max_ipo_depth

  vcp:
    id: "vcp"
    name: "Minervini VCP"
    icon: "📐"
    display_order: 5
    description: "Volatility Contraction Pattern with drying volume along Stage 2 uptrend."
    filters:
      enforce_stage2: true       # Overrides base_setup (false -> true)
      enable_vcp_pattern: true
      enable_low_cheat: false
      min_base_depth: 12.0
      max_base_depth: 45.0
      max_base_position: 50.0
      require_exhaustion_or_shakeout: true
      enable_vcp_eps_growth: false
      min_eps_growth_qoq: 20.0
      require_pivot_tightness: false
      max_pivot_spread: 8.0
      max_pivot_clustering: 3.0
      max_pivot_vol_ratio: 0.80
    visible_filters:
      - enforce_stage2
      - enable_vcp_pattern
      - enable_low_cheat
      - min_base_depth
      - max_base_depth
      - max_base_position
      - require_exhaustion_or_shakeout
      - enable_vcp_eps_growth
      - min_eps_growth_qoq
      - enable_adr
      - min_adr_20d
      - require_pivot_tightness
      - max_pivot_spread
      - max_pivot_clustering
      - max_pivot_vol_ratio

  momentum:
    id: "momentum"
    name: "My Universe"
    icon: "🌌"
    display_order: 6
    description: "Filters a broad universe of liquid stocks for further screening across Stage 2 and Momentum Gainers."
    sub_title: "Universe View:"
    sub_setups:
      - id: "all"
        name: "All"
        label: "🌌 All (Stage 2 + Gainers)"
        filters:
          qm_subview: "all"
      - id: "stage2"
        name: "Stage 2"
        label: "📈 Stage 2"
        filters:
          qm_subview: "stage2"
      - id: "gainers"
        name: "All Gainers"
        label: "🏆 All Gainers"
        filters:
          qm_subview: "gainers"
      - id: "1m"
        name: "1M Gainers"
        label: "⚡ 1M Gainers"
        filters:
          qm_subview: "1m"
      - id: "3m"
        name: "3M Gainers"
        label: "🚀 3M Gainers"
        filters:
          qm_subview: "3m"
      - id: "6m"
        name: "6M Gainers"
        label: "🌊 6M Gainers"
        filters:
          qm_subview: "6m"
    filters:
      require_momentum: true      
      enable_rs: true
      min_rs_percentile: 80
      qm_subview: "all"
      qm_top_n: 75
    visible_filters:
      - qm_subview
      - qm_top_n
      - enable_rs
      - min_rs_percentile
      - enable_adr
      - min_adr_20d
