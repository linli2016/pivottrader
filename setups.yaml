# PivotTrader - Centralized Setup Configurations
#
# Setup definitions with TC2000-compatible scan expressions (PCF).
# ==============================================================================

setups:
  breakout:
    id: "breakouts"
    name: "Breakouts"
    icon: "🎯"
    display_order: 1
    description: "Consolidations and High Tight Flags (Power Plays) ready to break out along rising moving averages."
    sub_title: "Breakout Mode:"
    expression: "C >= 5.0 AND DOLLAR_VOL >= 3000000 AND BREAKOUT AND ADR20 >= 4.0 AND PIVOT_SPREAD <= 8.0 AND PIVOT_CLUSTERING <= 3.0"
    sub_setups:
      - id: "htf"
        name: "Power Play / HTF"
        label: "⚡ Power Play / HTF (100%+ Move, ≤25% Pullback)"
        expression: "C >= 5.0 AND DOLLAR_VOL >= 3000000 AND RUNUP >= 100.0 AND RUNUP_DAYS <= 40 AND PULLBACK <= 25.0 AND DAYS_SINCE_PEAK >= 10"
      - id: "standard"
        name: "QM Breakouts"
        label: "🎯 QM Breakouts (30%+ Move)"
        expression: "C >= 5.0 AND DOLLAR_VOL >= 3000000 AND BREAKOUT AND ADR20 >= 4.0 AND PIVOT_SPREAD <= 8.0 AND PIVOT_CLUSTERING <= 3.0"

  episodic_pivot:
    id: "episodic_pivot"
    name: "Episodic Pivot"
    icon: "⚡"
    display_order: 2
    description: "Massive gap-up (10%+) on heavy relative volume driven by catalyst or earnings."
    expression: "C >= 5.0 AND DOLLAR_VOL >= 5000000 AND GAP_PCT >= 10.0 AND REL_VOL >= 2.5"

  parabolic:
    id: "parabolic"
    name: "Parabolic Short"
    icon: "🌋"
    display_order: 3
    description: "Overextended momentum climaxes for mean-reversion short setups."
    expression: "C >= 1.0 AND PARABOLIC_SHORT AND DIST_EMA10 >= 18.0 AND UP_DAYS >= 3"

  ipo_base:
    id: "ipo_base"
    name: "IPO Base"
    icon: "🌱"
    display_order: 4
    description: "Early institutional accumulation in newly public companies (< 350 days)."
    expression: "DOLLAR_VOL >= 5000000 AND IPO_DAYS >= 10 AND IPO_DAYS <= 350 AND IPO_DRAWDOWN <= 25.0 AND IPO_DEPTH <= 35.0"

  vcp:
    id: "vcp"
    name: "Minervini VCP"
    icon: "📐"
    display_order: 5
    description: "Volatility Contraction Patterns, Cheats, and Cup and Handle setups along Stage 2 uptrend."
    sub_title: "Minervini Mode:"
    expression: "STAGE2 AND LOW_CHEAT AND C >= 5.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS <= 50.0"
    sub_setups:
      - id: "low_cheat"
        name: "Low Cheat"
        label: "🏹 Low Cheat (Lower Base)"
        description: "Early reversal entry in lower 1/3-1/2 of base with selling exhaustion or shakeout."
        expression: "STAGE2 AND LOW_CHEAT AND C >= 5.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS <= 50.0"
      - id: "cheat"
        name: "Cheat"
        label: "⚡ Cheat / 3-C (Mid-Upper Base)"
        description: "Cup Completion Cheat (3-C) in mid-to-upper base before reaching prior peak."
        expression: "STAGE2 AND CHEAT AND C >= 5.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS >= 40.0 AND BASE_POS <= 80.0"
      - id: "cup_and_handle"
        name: "Cup and Handle"
        label: "☕ Cup and Handle"
        description: "Classic VCP breakout at the handle pivot near base peak / 52w high."
        expression: "STAGE2 AND VCP AND C >= 5.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0"

  momentum:
    id: "momentum"
    name: "Momentum"
    icon: "🌌"
    display_order: 6
    description: "Filters a broad universe of liquid stocks for further screening across Stage 2 and Momentum Gainers."
    sub_title: "Momentum View:"
    default_sub_id: "leaders"
    expression: "STAGE2 AND RS_RANK >= 90 AND ADR20 >= 4.0 AND C >= 10.0 AND C > XAVGC50 AND XAVGC10 > XAVGC20 AND DIST_52W_LOW >= 70.0 AND DAYS_52W_HIGH >= 10"
    sub_setups:
      - id: "all"
        name: "All"
        label: "🌌 All (Stage 2 + Gainers)"
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND (STAGE2 OR RET_1M >= 20.0 OR RET_3M >= 30.0 OR RET_6M >= 50.0)"
      - id: "stage2"
        name: "Stage 2"
        label: "📈 Stage 2"
        expression: "STAGE2 AND C >= 5.0 AND DOLLAR_VOL >= 10000000"
      - id: "leaders"
        name: "Leaders"
        label: "🚀 Leaders"
        expression: "STAGE2 AND RS_RANK >= 90 AND ADR20 >= 4.0 AND C >= 10.0 AND C > XAVGC50 AND XAVGC10 > XAVGC20 AND DIST_52W_LOW >= 70.0 AND DAYS_52W_HIGH >= 10"
      - id: "gainers"
        name: "All Gainers"
        label: "🏆 All Gainers (Top 50s)"
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND ((RET_1M >= 20.0 AND TOP(RET_1M, 50)) OR (RET_3M >= 30.0 AND TOP(RET_3M, 50)) OR (RET_6M >= 50.0 AND TOP(RET_6M, 50)))"
      - id: "1m"
        name: "1M Gainers"
        label: "⚡ 1M (Top 50)"
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND RET_1M >= 20.0 ORDER BY RET_1M DESC LIMIT 50"
      - id: "3m"
        name: "3M Gainers"
        label: "🚀 3M (Top 50)"
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND RET_3M >= 30.0 ORDER BY RET_3M DESC LIMIT 50"
      - id: "6m"
        name: "6M Gainers"
        label: "🌊 6M (Top 50)"
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND RET_6M >= 50.0 ORDER BY RET_6M DESC LIMIT 50"

