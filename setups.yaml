# PivotTrader - Centralized Setup Configurations
#
# Setup definitions with TC2000-compatible scan expressions (PCF).
# Two-Level Organization: Screener Folders -> Screeners
# ==============================================================================

folders:
  daily:
    id: "daily"
    name: "Daily"
    icon: "⚡"
    display_order: 1
    description: "Actionable trigger patterns and exact-day pivot buy points for daily monitoring and execution."
    default_screener_id: "power_play"
    screeners:
      - id: "power_play"
        name: "Power Play"
        icon: "⚡"
        description: "100%+ Move within 8 weeks, <=25% Pullback, tight flag consolidation."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 3000000 AND RUNUP >= 100.0 AND RUNUP_DAYS <= 40 AND PULLBACK <= 25.0 AND DAYS_SINCE_PEAK >= 10"
      - id: "qm_breakouts"
        name: "QM Breakouts"
        icon: "🎯"
        description: "30%+ prior move, tight 10/20 EMA surf, pivot clustering <= 3%."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 3000000 AND (COALESCE(RUNUP, 0) >= 30.0 OR COALESCE(RET_1M, 0) >= 15.0 OR COALESCE(RET_3M, 0) >= 30.0) AND ADR20 >= 4.0 AND PIVOT_SPREAD <= 8.0 AND PIVOT_CLUSTERING <= 3.0 AND PULLBACK <= 30.0 AND DAYS_SINCE_PEAK >= 10 AND DAYS_SINCE_PEAK <= 40 AND C > EMA_20 AND EMA_10 > EMA_20"
      - id: "episodic_pivot"
        name: "Episodic Pivot"
        icon: "💥"
        description: "Massive gap-up (10%+) on heavy relative volume (>= 2.5x) driven by catalyst or earnings."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 5000000 AND GAP_PCT >= 10.0 AND REL_VOL >= 2.5"
      - id: "parabolic"
        name: "Parabolic Short"
        icon: "🌋"
        description: "Overextended momentum climaxes (>= 18% above 10 EMA) for mean-reversion short setups."
        expression: "C >= 1.0 AND PARABOLIC_SHORT AND DIST_EMA10 >= 18.0 AND UP_DAYS >= 3"
      - id: "cup_and_handle"
        name: "Cup and Handle"
        icon: "☕"
        description: "Classic VCP breakout at the handle pivot near base peak / 52w high."
        expression: "STAGE2 AND VCP AND C >= 5.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0"
      - id: "cheat"
        name: "Cheat / 3-C"
        icon: "🔑"
        description: "Cup Completion Cheat (3-C) in mid-to-upper base before reaching prior peak."
        expression: "STAGE2 AND CHEAT AND C >= 5.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS >= 40.0 AND BASE_POS <= 80.0"
      - id: "low_cheat"
        name: "Low Cheat"
        icon: "🏹"
        description: "Early reversal entry in lower 1/3-1/2 of base with selling exhaustion or shakeout."
        expression: "STAGE2 AND LOW_CHEAT AND C >= 5.0 AND BASE_DEPTH >= 12.0 AND BASE_DEPTH <= 45.0 AND BASE_POS <= 50.0"

  weekly:
    id: "weekly"
    name: "Weekly"
    icon: "📅"
    display_order: 2
    description: "Universe preparation, multi-timeframe momentum rankings, IPO pipeline, and trend duration."
    default_screener_id: "leaders"
    screeners:
      - id: "leaders"
        name: "Leaders"
        icon: "👑"
        group: "Momentum"
        description: "Leading Stage 2 momentum stocks with RS Rank >= 90 and strong moving averages."
        expression: "STAGE2 AND RS_RANK >= 90 AND ADR20 >= 4.0 AND C >= 10.0 AND C > XAVGC50 AND XAVGC10 > XAVGC20 AND DIST_52W_LOW >= 70.0 AND DAYS_52W_HIGH >= 10"
      - id: "ipo_base"
        name: "IPO Base"
        icon: "🐣"
        group: "Bases"
        description: "Early institutional accumulation in newly public companies (< 350 days)."
        expression: "DOLLAR_VOL >= 5000000 AND IPO_DAYS >= 10 AND IPO_DAYS <= 350 AND IPO_DRAWDOWN <= 25.0 AND IPO_DEPTH <= 35.0"
      - id: "trend_1m"
        name: "1M Trend"
        icon: "🌱"
        group: "Trend Template"
        description: "Early Stage 2 turnaround with 50 > 150 > 200 SMA stack for ~1 month (<= 25 trading days)."
        expression: "STAGE2 AND STAGE2_DAYS <= 25 AND RS_RANK >= 70 AND C >= 5.0 AND DOLLAR_VOL >= 10000000"
      - id: "trend_1_4m"
        name: "1~4M Trend"
        icon: "🌿"
        group: "Trend Template"
        description: "Developing Stage 2 uptrend with 50 > 150 > 200 SMA stack for 1 to 4 months (26 to 80 trading days)."
        expression: "STAGE2 AND STAGE2_DAYS > 25 AND STAGE2_DAYS <= 80 AND RS_RANK >= 70 AND C >= 5.0 AND DOLLAR_VOL >= 10000000"
      - id: "trend_5m"
        name: "5M Trend"
        icon: "🏛️"
        group: "Trend Template"
        description: "Established Stage 2 institutional trend with 50 > 150 > 200 SMA stack for > 4 months (> 80 trading days)."
        expression: "STAGE2 AND STAGE2_DAYS > 80 AND RS_RANK >= 70 AND C >= 5.0 AND DOLLAR_VOL >= 10000000"
      - id: "gainers"
        name: "All Gainers"
        icon: "🏆"
        group: "Momentum"
        description: "Top 50 percentage gainers across 1M, 3M, or 6M momentum timeframes."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND ((RET_1M >= 20.0 AND TOP(RET_1M, 50)) OR (RET_3M >= 30.0 AND TOP(RET_3M, 50)) OR (RET_6M >= 50.0 AND TOP(RET_6M, 50)))"
      - id: "1m"
        name: "1M Gainers"
        icon: "🔥"
        group: "Momentum"
        description: "Top 50 fastest moving momentum runners over 1 month."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND RET_1M >= 20.0 ORDER BY RET_1M DESC LIMIT 50"
      - id: "3m"
        name: "3M Gainers"
        icon: "🚀"
        group: "Momentum"
        description: "Top 50 intermediate momentum gainers over 3 months."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND RET_3M >= 30.0 ORDER BY RET_3M DESC LIMIT 50"
      - id: "6m"
        name: "6M Gainers"
        icon: "🌊"
        group: "Momentum"
        description: "Top 50 sustained institutional leaders over 6 months."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND RET_6M >= 50.0 ORDER BY RET_6M DESC LIMIT 50"
      
  others:
    id: "others"
    name: "Others"
    icon: "📁"
    display_order: 3
    description: "Baseline market filters and universe definitions."
    default_screener_id: "stage2"
    screeners:
      - id: "stage2"
        name: "Stage 2"
        icon: "📈"
        description: "Mark Minervini Stage 2 uptrend template with rising 200-day moving average."
        expression: "STAGE2 AND C >= 5.0 AND DOLLAR_VOL >= 10000000"
      - id: "all"
        name: "All Gainers + Stage 2"
        icon: "🌌"
        description: "Comprehensive universe of liquid Stage 2 stocks and multi-timeframe gainers."
        expression: "C >= 5.0 AND DOLLAR_VOL >= 10000000 AND (STAGE2 OR RET_1M >= 20.0 OR RET_3M >= 30.0 OR RET_6M >= 50.0)"

